spring:
  application:
    name: medislot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medislot_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

rate-limit:
  enabled: true
  policies:
    specializations:
      capacity: 60
      refill-tokens: 60
      refill-duration: 1m
    doctor-search:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    doctor-details:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    availability-read:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    availability-create:
      capacity: 20
      refill-tokens: 20
      refill-duration: 1m
    availability-update:
      capacity: 20
      refill-tokens: 20
      refill-duration: 1m
    availability-delete:
      capacity: 10
      refill-tokens: 10
      refill-duration: 1m
    appointment-book:
      capacity: 5
      refill-tokens: 5
      refill-duration: 1m
    appointment-patient-list:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    appointment-details:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    appointment-doctor-list:
      capacity: 30
      refill-tokens: 30
      refill-duration: 1m
    appointment-status-update:
      capacity: 10
      refill-tokens: 10
      refill-duration: 1m
    appointment-reschedule:
      capacity: 5
      refill-tokens: 5
      refill-duration: 1m
    appointment-cancel:
      capacity: 5
      refill-tokens: 5
      refill-duration: 1m
    assistant-chat:
      capacity: 10
      refill-tokens: 10
      refill-duration: 1m
    forgot-password:
      capacity: 5
      refill-tokens: 5
      refill-duration: 15m
    reset-password:
      capacity: 5
      refill-tokens: 5
      refill-duration: 15m
    profile-update:
      capacity: 20
      refill-tokens: 20
      refill-duration: 1m
    document-upload:
      capacity: 5
      refill-tokens: 5
      refill-duration: 10m

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  timeout-ms: ${GROQ_TIMEOUT_MS:5000}
  max-retries: ${GROQ_MAX_RETRIES:1}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  timeout-ms: ${GEMINI_TIMEOUT_MS:5000}
  max-retries: ${GEMINI_MAX_RETRIES:1}

ai:
  grounding:
    relevance-threshold: ${AI_RELEVANCE_THRESHOLD:0.2}
    retrieval-limit: ${AI_RETRIEVAL_LIMIT:5}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.medislot: INFO
    org.hibernate.SQL: WARN
