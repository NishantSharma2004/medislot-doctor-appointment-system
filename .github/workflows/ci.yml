name: MediSlot CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medislot_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        working-directory: ./Backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/medislot_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn clean test -B

      - name: Package Spring Boot Application
        working-directory: ./Backend
        run: mvn package -DskipTests -B

  frontend-build:
    name: Frontend Lint & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build React Frontend
        working-directory: ./Frontend
        env:
          VITE_API_BASE_URL: https://api.medislot.app
          VITE_USE_MOCK_API: 'false'
        run: npm run build
