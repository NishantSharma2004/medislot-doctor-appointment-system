trigger:
  branches:
    include:
      - main

variables:
  - group: vm_config

stages:
  # =======================================================
  # STAGE 1: CI (Continuous Integration - Cloud Verification)
  # =======================================================
  - stage: CI_Build_And_Test
    displayName: 'CI: Test & Build Code'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      # 1. Backend Java 21 Tests
      - job: Backend_Test
        displayName: 'Backend Maven Test'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@3
            displayName: 'Execute Maven Tests'
            continueOnError: true
            inputs:
              mavenPomFile: 'Backend/pom.xml'
              goals: 'clean test'
              publishJUnitResults: true

      # 2. Frontend React 18 / Vite Build Check
      - job: Frontend_Test
        displayName: 'Frontend Vite Build Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node 20'

          - script: |
              cd Frontend
              npm install
              NITRO_PRESET=node-server npm run build
            displayName: 'Install & Build Frontend'
            env:
              VITE_USE_MOCK_API: 'false'

  # =======================================================
  # STAGE 2: CD (Continuous Deployment - Direct SSH to VM)
  # =======================================================
  - stage: Deploy_To_VM
    displayName: 'CD: Deploy on Durrmi VM'
    dependsOn: CI_Build_And_Test
    condition: succeeded()
    jobs:
      - job: SSH_Deploy
        displayName: 'Deploy via SSH'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              mkdir -p ~/.ssh
              printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              sed -i 's/\r$//' ~/.ssh/id_rsa

              ssh -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" << 'EOF'
                set -e
                echo "🚀 Starting Automated Deployment on Durrmi VM..."

                # 1. Go to project directory
                cd /home/nishantsharma/Durmmi-website || cd ~/Durmmi-website

                # 2. Pull latest changes
                echo "📥 Pulling latest code..."
                git pull origin main

                # 3. Update Frontend (PM2)
                echo "⚡ Building Frontend and Restarting PM2..."
                cd Frontend
                npm install
                NITRO_PRESET=node-server npm run build
                PORT=4173 NITRO_PORT=4173 pm2 restart durrmi-frontend --update-env || PORT=4173 NITRO_PORT=4173 pm2 start .output/server/index.mjs --name "durrmi-frontend"

                echo "✅ Durrmi Frontend Deployment Done!"
              EOF
            displayName: 'Deploy via SSH'
            env:
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
              VM_USER: $(VM_USER)
              VM_HOST: $(VM_HOST)